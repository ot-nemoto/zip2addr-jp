name: Build and Release

on:
  push:
    branches: master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Prepare version
        id: prepare_version
        run: |
          set -euo pipefail
          if [ -f src/zip2addr/data_version.py ]; then
            DATA_DATE=$(python -c "import importlib.util,sys;spec=importlib.util.spec_from_file_location('dv','src/zip2addr/data_version.py');dv=importlib.util.module_from_spec(spec);spec.loader.exec_module(dv);print(getattr(dv,'DATA_DATE',''))")
          else
            DATA_DATE=$(date +%Y%m%d)
          fi

          if grep -q '^version' pyproject.toml; then
            MAJOR=$(grep '^version' pyproject.toml | sed -E 's/version\s*=\s*"([0-9]+)\.([0-9]+)\..*"/\1/' || echo 0)
            MINOR=$(grep '^version' pyproject.toml | sed -E 's/version\s*=\s*"([0-9]+)\.([0-9]+)\..*"/\2/' || echo 1)
          else
            MAJOR=0
            MINOR=1
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${DATA_DATE}"
          echo "Setting NEW_VERSION=${NEW_VERSION}"
          sed -E "s/^version\s*=.*/version = \"${NEW_VERSION}\"/" pyproject.toml > pyproject.toml.tmp
          mv pyproject.toml.tmp pyproject.toml

          echo "data_date=${DATA_DATE}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR}" >> $GITHUB_OUTPUT

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Create release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATA_DATE="${{ steps.prepare_version.outputs.data_date }}"
          if [ -z "${DATA_DATE}" ]; then
            DATA_DATE=$(date +%Y%m%d)
          fi

          MAJOR="${{ steps.prepare_version.outputs.major }}"
          MINOR="${{ steps.prepare_version.outputs.minor }}"

          TAG="${MAJOR}.${MINOR}.${DATA_DATE}"
          echo "Creating release ${TAG}"

          # Delete existing release and tag if they exist
          EXISTING=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          EXISTING_ID=$(echo "$EXISTING" | jq -r '.id // empty')
          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing release ${TAG} (id: ${EXISTING_ID})"
            curl -sS --fail -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${EXISTING_ID}"
            curl -sS -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" || true
          fi

          printf '{"tag_name":"%s","name":"%s"}' "${TAG}" "${TAG}" > release.json
          RELEASE_JSON=$(curl -sS --fail -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" -d @release.json)
          UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.upload_url' | sed 's/{.*//')

          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "ERROR: Failed to get upload URL from release response"
            echo "$RELEASE_JSON"
            exit 1
          fi

          echo "Uploading artifacts to ${UPLOAD_URL}"
          for f in dist/*; do
            echo "Uploading $f"
            curl -sS --fail -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/octet-stream" --data-binary @"$f" "${UPLOAD_URL}?name=$(basename $f)"
          done
